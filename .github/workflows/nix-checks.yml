name: Nix checks

# For repos whose flake owns their checks: the caller's `checks` output is the
# single source of truth, so adding a check to flake.nix adds a job here with
# no change to the workflow. Non-nix repos should keep using the individual
# check-formatting / lint / test / audit workflows instead.
on:
  workflow_call:
    inputs:
      system:
        description: The nix system to evaluate and build checks for.
        type: string
        required: false
        default: x86_64-linux
      runs-on:
        description: The runner to use. Must match `system`.
        type: string
        required: false
        default: ubuntu-latest
      max-store-size:
        description: Size in bytes to garbage collect the nix store down to before saving the cache.
        type: string
        required: false
        default: 5G
      prebuild:
        description: >-
          A flake installable to build once, before the checks fan out, and save
          to the cache they all restore — typically crane's `cargoArtifacts`.
          Without it every check job builds the shared dependencies itself.
        type: string
        required: false
        default: ''

# Every job shares one cache key, and a key is written once: whichever job saves
# first owns it and the rest log "Not saving a new cache". So exactly one job
# saves. With `prebuild` that is the job holding the dependencies; without it,
# `discover`, as before. The `-prebuilt` suffix keeps the two apart: a key
# already written by a `discover` would otherwise be an exact hit, and the
# prebuild would restore a store without its dependencies and decline to save.
jobs:
  discover:
    name: Discover checks
    runs-on: ${{ inputs.runs-on }}
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            access-tokens = github.com=${{ github.token }}

      - name: Setup cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock', 'rust-toolchain.toml') }}${{ inputs.prebuild != '' && '-prebuilt' || '' }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: ${{ inputs.max-store-size }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
          save: ${{ inputs.prebuild == '' }}

      - name: List checks
        id: list
        run: |
          checks=$(nix eval --json \
            ".#checks.${SYSTEM}" \
            --apply 'builtins.attrNames')
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
        env:
          SYSTEM: ${{ inputs.system }}

  prebuild:
    name: Build shared dependencies
    if: inputs.prebuild != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            access-tokens = github.com=${{ github.token }}

      - name: Setup cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock', 'rust-toolchain.toml') }}${{ inputs.prebuild != '' && '-prebuilt' || '' }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: ${{ inputs.max-store-size }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Build ${{ inputs.prebuild }}
        run: nix build -L "$PREBUILD"
        env:
          PREBUILD: ${{ inputs.prebuild }}

  check:
    name: ${{ matrix.check }}
    needs: [discover, prebuild]
    # `prebuild` is skipped when the input is empty, and a skipped need skips
    # its dependents unless the condition says otherwise.
    if: >-
      !cancelled()
      && needs.discover.result == 'success'
      && needs.prebuild.result != 'failure'
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.discover.outputs.checks) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            access-tokens = github.com=${{ github.token }}

      - name: Setup cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock', 'rust-toolchain.toml') }}${{ inputs.prebuild != '' && '-prebuilt' || '' }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: ${{ inputs.max-store-size }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
          save: false

      - name: Run check
        run: nix build -L ".#checks.${SYSTEM}.${CHECK}"
        env:
          SYSTEM: ${{ inputs.system }}
          CHECK: ${{ matrix.check }}
