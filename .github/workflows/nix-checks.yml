name: Nix checks

# For repos whose flake owns their checks: the caller's `checks` output is the
# single source of truth, so adding a check to flake.nix adds a job here with
# no change to the workflow. Non-nix repos should keep using the individual
# check-formatting / lint / test / audit workflows instead.
on:
  workflow_call:
    inputs:
      system:
        description: The nix system to evaluate and build checks for.
        type: string
        required: false
        default: x86_64-linux
      runs-on:
        description: The runner to use. Must match `system`.
        type: string
        required: false
        default: ubuntu-latest
      max-store-size:
        description: Size in bytes to garbage collect the nix store down to before saving the cache.
        type: string
        required: false
        default: 5G
      prebuild:
        description: >-
          A flake installable to build once, before the checks fan out, and save
          to the cache they all restore — typically crane's `cargoArtifacts`.
          Without it every check job builds the shared dependencies itself.
        type: string
        required: false
        default: ''

# Every job shares one cache key, and a key is written once: whichever job saves
# first owns it and the rest log "Not saving a new cache". So exactly one job
# saves. With `prebuild` that is the job holding the dependencies; without it,
# `discover`, as before. The `-prebuilt` suffix keeps the two apart: a key
# already written by a `discover` would otherwise be an exact hit, and the
# prebuild would restore a store without its dependencies and decline to save.
jobs:
  discover:
    name: Discover checks
    runs-on: ${{ inputs.runs-on }}
    outputs:
      checks: ${{ steps.list.outputs.checks }}
      unchanged: ${{ steps.unchanged.outputs.unchanged }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # The base commit has to be here to evaluate it.
          fetch-depth: 0

      - name: Install nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            access-tokens = github.com=${{ github.token }}

      - name: Setup cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock', 'rust-toolchain.toml') }}${{ inputs.prebuild != '' && '-prebuilt' || '' }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: ${{ inputs.max-store-size }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
          save: ${{ inputs.prebuild == '' }}

      - name: List checks
        id: list
        run: |
          checks=$(nix eval --json \
            ".#checks.${SYSTEM}" \
            --apply 'builtins.attrNames')
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
        env:
          SYSTEM: ${{ inputs.system }}

      # A check whose derivation is the base's has the base's result, so a pull
      # request that leaves its inputs alone need not build it. The flake's
      # filesets are the filter: no path list here to drift from them. It still
      # reports, because a required check that never reports blocks the merge.
      # Only pull requests skip: a push to the default branch builds everything,
      # which is what keeps it the green baseline this comparison leans on.
      - name: Find unchanged checks
        id: unchanged
        run: |
          unchanged='[]'
          # A pull request's checkout is its merge commit; the first parent is
          # the base it was merged onto.
          if [ "$EVENT" = pull_request ] && git rev-parse --verify -q HEAD^2 >/dev/null; then
            base=$(git rev-parse HEAD^1)
            apply='cs: builtins.mapAttrs (_: c: c.drvPath) cs'
            # Outside the checkout, which must stay clean while it is evaluated.
            head_json="${RUNNER_TEMP}/head.json"
            base_json="${RUNNER_TEMP}/base.json"
            if nix eval --json ".#checks.${SYSTEM}" --apply "$apply" > "$head_json" \
              && nix eval --json "git+file://${PWD}?rev=${base}#checks.${SYSTEM}" --apply "$apply" > "$base_json"; then
              unchanged=$(jq -c -n --slurpfile h "$head_json" --slurpfile b "$base_json" \
                '$h[0] | to_entries | map(select($b[0][.key] == .value) | .key)')
            fi
          fi
          echo "Unchanged since the base: $unchanged"
          echo "unchanged=$unchanged" >> "$GITHUB_OUTPUT"
        env:
          SYSTEM: ${{ inputs.system }}
          EVENT: ${{ github.event_name }}

  prebuild:
    name: Build shared dependencies
    if: inputs.prebuild != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            access-tokens = github.com=${{ github.token }}

      - name: Setup cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock', 'rust-toolchain.toml') }}${{ inputs.prebuild != '' && '-prebuilt' || '' }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: ${{ inputs.max-store-size }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Build ${{ inputs.prebuild }}
        run: nix build -L "$PREBUILD"
        env:
          PREBUILD: ${{ inputs.prebuild }}

  check:
    name: ${{ matrix.check }}
    needs: [discover, prebuild]
    # Run whatever `prebuild` did. It is skipped when the input is empty, and a
    # skipped need would skip these too. And a failed prebuild must not skip
    # them either: GitHub counts a skipped required check as passing, so the
    # pull request would be mergeable on a build that does not compile. Run,
    # rebuild the dependencies, and fail on their own account.
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.discover.outputs.checks) }}
    steps:
      - name: Skip, unchanged since the base
        if: ${{ contains(fromJson(needs.discover.outputs.unchanged), matrix.check) }}
        run: echo "The derivation of ${CHECK} is the base's, so its result is too."
        env:
          CHECK: ${{ matrix.check }}

      - name: Checkout repo
        if: ${{ !contains(fromJson(needs.discover.outputs.unchanged), matrix.check) }}
        uses: actions/checkout@v5

      - name: Install nix
        if: ${{ !contains(fromJson(needs.discover.outputs.unchanged), matrix.check) }}
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            access-tokens = github.com=${{ github.token }}

      - name: Setup cache
        if: ${{ !contains(fromJson(needs.discover.outputs.unchanged), matrix.check) }}
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock', 'rust-toolchain.toml') }}${{ inputs.prebuild != '' && '-prebuilt' || '' }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: ${{ inputs.max-store-size }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
          save: false

      - name: Run check
        if: ${{ !contains(fromJson(needs.discover.outputs.unchanged), matrix.check) }}
        run: nix build -L ".#checks.${SYSTEM}.${CHECK}"
        env:
          SYSTEM: ${{ inputs.system }}
          CHECK: ${{ matrix.check }}
